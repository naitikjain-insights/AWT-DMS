
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donors | AWT Donation Management</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172554;
        }
        header {
            background: #142b4a;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        header a { color: white; text-decoration: none; }
        main { max-width: 1100px; margin: 35px auto; padding: 0 18px; }
        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px #142b4a12;
        }
        h2 { margin-top: 0; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        label { display: block; margin-bottom: 7px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
        }
        button {
            background: #8b1e2d;
            color: white;
            border: 0;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 18px;
        }
        .message { padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { text-align: left; padding: 13px; border-bottom: 1px solid #e2e8f0; }
        th { background: #eaf0f6; }
        .back { color: #142b4a; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<header>
    <h2>AWT | Donor Management</h2>
    <a th:href="@{/}">← Dashboard</a>
</header>

<main>
    <div th:if="${success}" class="message success" th:text="${success}"></div>
    <div th:if="${error}" class="message error" th:text="${error}"></div>

    <section class="card">
        <h2>Register a Donor</h2>
        <p>Add the details of a person who wants to support your cause.</p>

        <form th:action="@{/donors/save}" th:object="${donor}" method="post">
            <div class="form-grid">
                <div>
                    <label for="name">Full Name *</label>
                    <input id="name" type="text" th:field="*{name}" required maxlength="100">
                </div>
                <div>
                    <label for="email">Email *</label>
                    <input id="email" type="email" th:field="*{email}" required maxlength="150">
                </div>
                <div>
                    <label for="phone">Phone *</label>
                    <input id="phone" type="tel" th:field="*{phone}" required maxlength="20">
                </div>
                <div>
                    <label for="address">Address</label>
                    <textarea id="address" th:field="*{address}" rows="2" maxlength="300"></textarea>
                </div>
            </div>
            <button type="submit">Add Donor</button>
        </form>
    </section>

    <section class="card">
        <h2>Registered Donors</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${donors}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.name}"></td>
                    <td th:text="${item.email}"></td>
                    <td th:text="${item.phone}"></td>
                    <td th:text="${item.address}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(donors)}">
                    <td colspan="5">No donors registered yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <a class="back" th:href="@{/}">Back to Dashboard</a>
</main>
</body>
</html>
