
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receipt Not Found | AWT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172b4d;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 40px 28px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #e6eaf1;
            box-shadow: 0 12px 35px rgba(23, 43, 77, 0.08);
        }

        .icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            display: grid;
            place-items: center;
            background: #edf1ff;
            color: #315efb;
            border-radius: 50%;
            font-size: 35px;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 12px;
        }

        p {
            color: #68758a;
            font-size: 15px;
            line-height: 1.7;
            margin: 0 0 25px;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .button {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .primary {
            background: #315efb;
            color: white;
        }

        .secondary {
            background: #e8edf5;
            color: #172b4d;
        }

        .button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon" aria-hidden="true">▤</div>

        <h1>Receipt Not Found</h1>

        <p>
            We could not find a donation receipt for this request.
            The donation may not exist, or the receipt ID may be incorrect.
        </p>

        <div class="actions">
            <a class="button primary" th:href="@{/donations}">
                View Donations
            </a>

            <a class="button secondary" th:href="@{/}">
                Back to Dashboard
            </a>
        </div>
    </main>
</body>
</html>
