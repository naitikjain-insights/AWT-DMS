
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWT | Donation Management System</title>

    <style>
        :root {
            --navy: #172b4d;
            --blue: #315efb;
            --bg: #f5f7fb;
            --muted: #68758a;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--navy);
        }

        header {
            background: var(--white);
            border-bottom: 1px solid #e6eaf1;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 19px;
            font-weight: 800;
        }

        .logo {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            background: var(--blue);
            color: white;
            border-radius: 12px;
            font-size: 25px;
        }

        nav {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--blue);
        }

        main {
            max-width: 1180px;
            margin: auto;
            padding: 44px 24px;
        }

        .hero {
            background: linear-gradient(120deg, #172b4d, #315efb);
            color: white;
            padding: 48px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            flex-wrap: wrap;
        }

        .hero-content {
            max-width: 650px;
        }

        .eyebrow {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #c6d5ff;
        }

        h1 {
            font-size: clamp(30px, 5vw, 46px);
            line-height: 1.15;
            margin: 16px 0;
        }

        .hero p {
            color: #e0e8ff;
            line-height: 1.7;
            max-width: 560px;
        }

        .hero-icon {
            font-size: 90px;
            opacity: 0.95;
        }

        .section-heading {
            margin: 38px 0 20px;
        }

        .section-heading h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .section-heading p {
            color: var(--muted);
            font-size: 14px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--white);
            padding: 25px;
            border-radius: 18px;
            border: 1px solid #e9edf4;
            box-shadow: 0 8px 24px rgba(20, 40, 80, 0.035);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(20, 40, 80, 0.08);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            background: #edf1ff;
            border-radius: 14px;
            font-size: 23px;
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .card p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.65;
            min-height: 46px;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 12px 16px;
            background: var(--blue);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .button:hover {
            background: #2449d8;
        }

        .notice {
            margin-top: 28px;
            padding: 20px;
            background: var(--white);
            border: 1px solid #e9edf4;
            border-radius: 14px;
            color: var(--muted);
            line-height: 1.7;
            font-size: 14px;
        }

        .notice strong {
            display: block;
            color: var(--navy);
            margin-bottom: 8px;
            font-size: 16px;
        }

        footer {
            text-align: center;
            padding: 28px 18px;
            color: var(--muted);
            font-size: 13px;
        }

        a:focus-visible {
            outline: 3px solid #8aa4ff;
            outline-offset: 3px;
        }
